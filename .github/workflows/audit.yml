name: 쿠폰 누락 자가 점검

# 공식 라운지 전체(약 2,300개)의 최근 3일 운영자 글을 수집기와 같은 파서로 다시 읽어,
# 사이트에 없는 코드가 있으면 그 글을 수집 대상에 넣고(scripts/naver-extra-posts.json)
# 추적하지 않던 라운지는 목록에 추가한 뒤 바로 수집한다.
# 사람이 매번 "놓친 거 없냐"고 대조하던 일을 대신한다(2026-09-28 도입).
# 한 번에 30분 남짓 걸려서 수집(2시간 간격)과 따로 하루 4번 돈다.
on:
  schedule:
    - cron: '7 0,6,12,18 * * *'   # KST 09:07 · 15:07 · 21:07 · 03:07 (자정 걸치지 않게)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 누락 점검
        run: node scripts/audit-naver.mjs | tee /tmp/out.log

      # 라운지에 코드를 안 올리고 카카오·카페·디스코드에만 푸는 게임(애니모·쿠키런 킹덤 등)을 블로그 검색으로 찾아
      # 지금 쓸 코드가 확인된 게임만 추가한다. 실패해도 나머지 단계는 그대로 돈다.
      - name: 블로그 검색으로 새 쿠폰 게임 찾기
        run: |
          node scripts/discover-search.mjs | tee -a /tmp/out.log || echo "discover-search 실패 — 다음 점검에서 다시"
          node scripts/collect-search.mjs | tee -a /tmp/out.log || echo "collect-search 실패"

      # 쿠폰 글인데 코드가 이미지에만 있는 글은 Claude 가 이미지를 직접 읽는다(맥스 구독 토큰 사용).
      # 토큰이 없거나 Claude 가 실패해도 나머지 단계는 그대로 돈다.
      - name: 이미지 속 쿠폰 읽기
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          node scripts/image-codes.mjs prepare | tee -a /tmp/out.log
          N=$(grep -oP 'IMAGE_POSTS=\K[0-9]+' /tmp/out.log | tail -1)
          if [ "${N:-0}" = "0" ] || [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "읽을 이미지 없음 또는 토큰 없음"; exit 0; fi
          npm install -g @anthropic-ai/claude-code > /dev/null 2>&1 || { echo "Claude Code 설치 실패"; exit 0; }
          cd /tmp/imgjobs
          timeout 900 claude -p "$(cat "$GITHUB_WORKSPACE/scripts/image-codes.prompt.md")" \
            --allowedTools "Read,Write" --permission-mode acceptEdits \
            | tail -5 || echo "Claude 실행 실패 — 다음 점검에서 다시 봄"
          cd "$GITHUB_WORKSPACE"
          node scripts/image-codes.mjs apply | tee -a /tmp/out.log

      - name: 네이버 라운지 수집
        run: node scripts/collect-naver.mjs | tee -a /tmp/out.log

      - name: 게임 이미지 받기
        run: |
          npm install --no-save --no-audit --no-fund sharp@0.33.5 > /dev/null 2>&1 || true
          node scripts/images.mjs | tee -a /tmp/out.log || true

      # 자정을 넘겨 끝나거나 이번에 다시 안 읽은 게임의 만료 코드를 내린다(발행 점검 실패 방지)
      - name: 만료 코드 정리
        run: node scripts/expire.mjs | tee -a /tmp/out.log

      - name: 통계 생성
        run: node scripts/stats.mjs | tee -a /tmp/out.log

      - name: 변경분 커밋
        run: |
          FIXED=$(grep -oP 'AUDIT_FIXED=\K[0-9]+' /tmp/out.log | tail -1)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games data/stats.json scripts/naver-lounges.json scripts/naver-extra-posts.json scripts/audit-report.json scripts/image-codes.json scripts/search-games.found.json scripts/search-discover.json public/g
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          STAMP=$(TZ=Asia/Seoul date '+%m-%d %H:%M')
          git commit -m "audit: ${STAMP} 자가 점검 · 놓친 글/라운지 ${FIXED:-0}건 반영"
          for i in 1 2 3; do
            if git push; then echo "푸시 완료(시도 ${i}회)"; exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; echo "리베이스 실패"; exit 1; }
          done
          git push

      - name: 발행 점검
        run: node scripts/verify.mjs
