name: 쿠폰 수집

# 게임 쿠폰은 퀴즈처럼 매일 쏟아지지 않는다(경쟁사 실측 월 10~20건).
# 그래서 5분마다 돌 이유가 없다 — 3시간마다 한 바퀴면 놓치지 않는다.
# 정각·30분 근처(5,35)는 깃허브가 붐벼서 실제로는 2~4시간에 한 번만 돌았다(9/19 실측). 붐비지 않는 분으로 옮긴다.
on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # v4 는 Node20 위에서 도는 액션이다.
      # 깃허브가 2026-09-23 자로 러너에서 Node20 을 완전히 제거해서
      # v4 를 쓰면 매 실행마다 "Node.js 20은 더 이상 사용되지 않습니다" 경고가 붙는다.
      # v5 가 Node24 로 올라간 첫 메이저 버전이다.
      - uses: actions/checkout@v5

      # node-version 은 위 경고와 별개다 — 수집 스크립트를 돌릴 Node 다.
      # Node20 은 2026-04 로 수명이 끝났다. 22 는 LTS 이고 sharp 0.33.5 요구사항
      # (^18.17 || ^20.3 || >=21)도 만족한다.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 해외 코드 허브(Pocket Gamer) 수집은 뺐다(2026-09-23). 한국 사람이 영문 게임 쿠폰을 한국 사이트에서
      # 찾지 않고, 만료 목록 코드를 사용 가능으로 올리는 문제까지 있었다. 한국 출처(네이버 라운지·검색)만 쓴다.
      - name: 해외 게임 정리
        run: node scripts/drop-overseas.mjs | tee /tmp/out.log

      # 수집 결과를 숫자로 남긴다. 홈의 "오늘 새 쿠폰 N개" 배지와
      # 수집기가 조용히 죽었는지 확인하는 근거가 된다.
      # 쿠폰 내는 라운지를 찾아 목록(scripts/naver-lounges.json)에 자동으로 넣는다.
      #   1단계: 홈 "따끈따끈 이벤트 소식"의 쿠폰·사전예약 이벤트 라운지
      #   2단계: 공식 라운지 전체(2,300개) 순회 — 신규·인기 순위부터, 한 번에 180개씩
      #   (깃허브가 예약 실행을 2시간에 한 번꼴로 돌린다. 180개면 하루 남짓에 한 바퀴 — 라운지마다 2일 안에 다시 본다)
      # 실제 코드가 읽히는 라운지만 넣는다. 순회 기록은 scripts/naver-sweep.json.
      - name: 네이버 쿠폰 라운지 발굴
        run: node scripts/discover-naver.mjs --sweep=180 | tee -a /tmp/out.log

      # 네이버 게임 라운지 — 국내 게임 쿠폰의 주 소스.
      # 삼국지:리버스·넋나간 삼국지는 매주 금요일, 심연 삼국은 주 1~2회 코드를 올린다.
      - name: 네이버 라운지 수집
        run: node scripts/collect-naver.mjs | tee -a /tmp/out.log

      # 라운지 쿠폰 게시판이 회원 전용이거나 없는 게임 — 네이버 블로그 검색으로 보완.
      # 최근 1개월 글만 본다. 지난 쿠폰은 담지 않는다.
      - name: 네이버 검색 보완 수집
        run: node scripts/collect-search.mjs | tee -a /tmp/out.log

      # 새로 들어온 게임의 대표 이미지. 없으면 카드가 글자만 남는다.
      # sharp 는 이 단계에서만 쓰므로 package.json 에 넣지 않고 그때그때 받는다.
      - name: 게임 이미지 받기
        run: |
          npm install --no-save --no-audit --no-fund sharp@0.33.5 > /dev/null 2>&1 || true
          node scripts/images.mjs | tee -a /tmp/out.log || true

      - name: 통계 생성
        run: node scripts/stats.mjs | tee -a /tmp/out.log

      - name: 변경분 커밋
        run: |
          CHANGED=$(grep -oP 'NAVER_CHANGED=\K[0-9]+' /tmp/out.log | tail -1)
          NEW=$(grep -oP 'STATS_TODAY_NEW=\K[0-9]+' /tmp/out.log | tail -1)
          ADDED=$(grep -oP 'DISCOVER_ADDED=\K[0-9]+' /tmp/out.log | tail -1)
          echo "변경된 게임: ${CHANGED:-0} / 오늘 신규 코드: ${NEW:-0} / 새로 찾은 게임: ${ADDED:-0}"
          # 쿠폰 변경이 없어도 stats.json 은 매번 갱신되어야 하므로
          # CHANGED 로 조기 종료하지 않고 실제 diff 로만 판단한다.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games data/stats.json scripts/naver-lounges.json scripts/naver-sweep.json scripts/search-games.auto.json public/g
          if git diff --cached --quiet; then
            echo "실제 diff 없음 — 커밋 생략"
            exit 0
          fi
          STAMP=$(TZ=Asia/Seoul date '+%m-%d %H:%M')
          SUFFIX=""
          if [ "${ADDED:-0}" != "0" ]; then SUFFIX=" · 새 게임 ${ADDED}"; fi
          git commit -m "data: ${STAMP} 게임 ${CHANGED:-0}개 갱신 · 신규 코드 ${NEW:-0}${SUFFIX}"
          # 수집이 도는 15분 사이에 사람이 푸시하면 push 가 거부된다(9/19 실측 run #125:
          # "! [rejected] main -> main (fetch first)"). 수집 결과를 통째로 날리는 사고라
          # 원격을 받아 그 위에 얹고 다시 민다.
          # 같은 파일이 부딪히면 이번 수집분을 택한다(-X theirs = 재생되는 우리 커밋 쪽).
          # 어차피 매번 소스에서 새로 만드는 값이라 잃는 게 없다.
          for i in 1 2 3; do
            if git push; then
              echo "푸시 완료(시도 ${i}회)"
              exit 0
            fi
            echo "푸시 거부됨 — 원격을 받아 다시 얹는다 (${i}/3)"
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; echo "리베이스 실패"; exit 1; }
          done
          git push

      # 마지막 점검. 수집이 멈췄거나 데이터가 깨졌으면 여기서 실패시킨다.
      - name: 발행 점검
        run: node scripts/verify.mjs
